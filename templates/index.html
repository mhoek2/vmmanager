<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Simple control panel to manage VMware Workstation with aria in mind">
    <meta name="author" content="Marco Hoekstra">
    <meta name="license" content="https://www.gnu.org/licenses/old-licenses/gpl-2.0.html">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>VM Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            --panel-background-color: #ffffff;
            --panel-border-radius: 10px;
            --table-border-radius: 10px;
        }

        html {
            height: 100%;
        }

        .backgorund {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

            .backgorund > .disc {
                position: absolute;
                border-radius: 50%;
                filter: blur(100px);
                opacity: 0.5;
            }

                .backgorund > .disc.disc1 {
                    width: 500px;
                    height: 500px;
                    background: #70a9fd;
                    top: -100px;
                    left: -100px;
                    animation: float1 9s ease-in-out infinite;
                }

                .backgorund > .disc.disc2 {
                    width: 600px;
                    height: 600px;
                    background: #9ccf95;
                    bottom: -150px;
                    right: -100px;
                    animation: float2 7s ease-in-out infinite;
                }

                .backgorund > .disc.disc3 {
                    width: 450px;
                    height: 450px;
                    background: #7dd3db;
                    top: 40%;
                    left: 60%;
                    animation: float3 10s ease-in-out infinite;
                }

        /* movement */
        @keyframes float1 {
            0%,100% {
                transform: translate(0,0) scale(1);
            }

            50% {
                transform: translate(100px,80px) scale(1.1);
            }
        }

        @keyframes float2 {
            0%,100% {
                transform: translate(0,0) scale(1);
            }

            50% {
                transform: translate(-120px,-60px) scale(1.15);
            }
        }

        @keyframes float3 {
            0%,100% {
                transform: translate(0,0) scale(1);
            }

            50% {
                transform: translate(-80px,120px) scale(1.08);
            }
        }

        body {
            --angle: 151deg;
            background: linear-gradient(var(--angle), #cee5ff, #8cd0df, #7ad98f);
        }

        #main_container {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--panel-background-color);
            border-radius: var(--panel-border-radius);
            padding: 2em;
            max-width: 50em;
            margin: 5em auto 0 auto;
        }

            #main_container::before {
                content: '';
                position: absolute;
                top: -1em;
                bottom: -1em;
                right: -1em;
                left: -1em;
                border-radius: var(--panel-border-radius);
                background-color: rgb(255 255 255 / 30%);
                backdrop-filter: blur(10px);
                z-index: -99;
            }

        table {
            width: 100%;
            border-radius: var(--table-border-radius);
            overflow: hidden;
            color: #1f1f1f;
        }

            table thead {
                background: #e9eef6;
            }

            table th {
                padding: 0.5em 0;
            }

            table tr:nth-child(even) {
                background: #f8fafd;
                padding: 0.2em 0;
            }

            table td {
                padding: 10px;
            }

                table td button:nth-child(1) {
                    margin-right: 2em;
                }

        input {
            background: #fff;
            border: var(--input-border-size) solid transparent;
            box-shadow: 0 0 0 1px #ced4da inset;
            border-radius: .8rem;
            padding: 1rem .75rem;
            padding-left: 15px;
            position: relative;
        }

        button {
            padding: 0.2em 1.0em;
            background: transparent;
            border: 1px solid #f1f1f1;
            color: #1f1f1f;
            border-radius: 2em;
            cursor: pointer;
            opacity: 0.7;
            transition: all ease-in-out 100ms
        }

            button:hover {
                opacity: 1.0;
            }

            button.blue {
                border-color: rgb(80 151 231);
                color: #1d86fd;
            }

            button.orange {
                border-color: #f3a867;
                color: orangered;
            }

            button.remove:hover {
                border-color: #f56969;
                color: #f56969;
            }

            button.vm_refresh_button {
                padding: 0.5em 1.0em;
                margin-top: 1em;
            }

            button.vm_refresh_button {
            }

        .add_vm_container {
            background: #f1f1f1;
            border-radius: 10px;
            padding: 0.1em 1em 1em 1em;
            margin-top: 2em;
        }

            .add_vm_container h2 {
                display: block;
            }

            .add_vm_container .form_content {
                display: flex;
                flex-direction: row;
                align-items: center;
            }

                .add_vm_container .form_content label {
                    margin-right: 1em;
                    font-weight: bold;
                }

                .add_vm_container .form_content input {
                    flex: 2;
                    margin-right: 1em;
                }

                .add_vm_container .form_content button {
                    padding: 1rem .75rem;
                    border-radius: .8rem;
                }

        #status {
            background: #f8fafd;
            border: 1px solid #e9eef6;
            color: #8b8b8b;
            margin-top: 2em;
            padding: 0 0.5em;
            border-radius: 5px;
            line-height: 2em;
            overflow-wrap: break-word;
        }
            /* response messaging is not ready for message types yet */
            #status.success {
                color: #166534;
                background: #ecfdf5;
                border-color: #bbf7d0;
            }

            #status.error {
                color: #7f1d1d;
                background: #fef2f2;
                border-color: #fecaca;
            }

            #status.warning {
                color: #7c2d12;
                background: #fff7ed;
                border-color: #fed7aa;
            }

        footer {
            color: #3a577b;
            position: fixed;
            bottom: 0;
            left: 1em;
        }
    </style>
</head>
<body>
    <div class="backgorund" aria-hidden="true">
        <div class="disc disc1"></div>
        <div class="disc disc2"></div>
        <div class="disc disc3"></div>
    </div>

    <div id="main_container" role="main">
        <h1>VM Manager</h1>

        <section aria-labelledby="vm_list_title">
            <h2 id="vm_list_title">Lijst met Virtual Machines</h2>

            <table aria-label="Lijst met Virtual Machines met status en acties">
                <thead>
                    <tr>
                        <th scope="col">VM Name</th>
                        <th scope="col" width="150">Status</th>
                        <th scope="col" width="200">Actions</th>
                    </tr>
                </thead>
                <tbody id="vms"></tbody>
            </table>

            <button class="vm_refresh_button orange" type="button" aria-controls="vms" onclick="fetch_vms( true )">Ververs lijst</button>
        </section>

        <section role="region" aria-labelledby="add_vm_title" class="add_vm_container">
            <h2 id="add_vm_title">VM toevoegen aan lijst</h2>

            <form class="form_content">
                <label for="add_vm_path">Pad naar VMX-bestand</label>
                <input type="text" id="add_vm_path" placeholder="C:\vms\vm.vmx" aria-required="true">
                <button class="blue" id="add_vm_button" type="button">VM Toevoegen</button>
            </form>
        </section>

        <div role="status" class="warning" aria-live="polite" aria-atomic="true" id="status"></div>
    </div>

    <footer aria-hidden="true">
        <p>© 2026 Marco H. This work is licensed under the <a target="_blank" tabindex="-1" href="https://www.gnu.org/licenses/old-licenses/gpl-2.0.html">GPLv2</a>.</p>
    </footer>

    <script>
        const fetch_vms_interval = 3000;
        const add_vm_path = document.getElementById('add_vm_path');
        const add_vm_button = document.getElementById('add_vm_button');

        function announce(msg) {
            const status = document.getElementById('status');
            status.textContent = msg;
        }

        async function fetch_vms(manual_refresh = false) {
            const res = await fetch('/vms');
            const data = await res.json();
            const vms = data.list;

            const table = document.getElementById('vms');

            // Track existing rows by VM name
            const current_vms = {};
            Array.from(table.rows).forEach(row => {
                const name = row.cells[0].textContent;
                current_vms[name] = row;
            });

            // Update or add rows
            vms.forEach(vm => {
                if (current_vms[vm.name]) {
                    // VM already exists, just update status and button
                    const row = current_vms[vm.name];

                    // status
                    if (row.cells[1].textContent !== vm.status) {
                        announce(vm.name + " status is gewijzigd naar " + vm.status);
                    }
                    row.cells[1].textContent = vm.status;

                    // action button
                    const btn = row.cells[2].querySelector('button');
                    if (vm.status === 'aan') {
                        btn.textContent = 'Stop';
                        btn.setAttribute('aria-label', 'Stop VM ' + vm.name);
                        btn.setAttribute('type', 'button');
                        btn.setAttribute('class', 'blue');
                        btn.onclick = () => vm_stop(vm.name);
                    } else {
                        btn.textContent = 'Start';
                        btn.setAttribute('aria-label', 'Start VM ' + vm.name);
                        btn.setAttribute('type', 'button');
                        btn.setAttribute('class', 'blue');
                        btn.onclick = () => vm_start(vm.name);
                    }

                    delete current_vms[vm.name]; // mark as handled
                }

                else {
                    // VM is new, create a new row
                    const row = document.createElement('tr');

                    const td_name = document.createElement('td');
                    td_name.textContent = vm.name;

                    const td_status = document.createElement('td');
                    td_status.textContent = vm.status;

                    const td_actions = document.createElement('td');
                    const btn_start_stop = document.createElement('button');
                    if (vm.status === 'aan') {
                        btn_start_stop.textContent = 'Stop';
                        btn_start_stop.setAttribute('aria-label', 'Stop VM ' + vm.name);
                        btn_start_stop.onclick = () => vm_stop(vm.name);
                        btn_start_stop.setAttribute('class', 'blue');
                    } else {
                        btn_start_stop.textContent = 'Start';
                        btn_start_stop.setAttribute('aria-label', 'Start VM ' + vm.name);
                        btn_start_stop.onclick = () => vm_start(vm.name);
                        btn_start_stop.setAttribute('class', 'blue');
                    }

                    const btn_remove = document.createElement('button');
                    btn_remove.textContent = 'Verwijder';
                    btn_remove.setAttribute('aria-label', 'Verwijder VM ' + vm.name + ' uit de lijst');
                    btn_remove.setAttribute('type', 'button');
                    btn_remove.onclick = () => vm_remove(vm.name);

                    td_actions.appendChild(btn_start_stop);
                    td_actions.appendChild(btn_remove);

                    row.appendChild(td_name);
                    row.appendChild(td_status);
                    row.appendChild(td_actions);

                    table.appendChild(row);
                }
            });

            // Remove rows that no longer exist
            Object.values(current_vms).forEach(row => row.remove());

            if (manual_refresh)
                announce("VM lijst is geupdate");
        }

        async function vm_send_action(name, url, message, fail) {
            try {
                announce(message);

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const data = await res.json();

                if (res.ok && data.status) {
                    //announce(message);
                } else {
                    announce(fail + ": " + (data.message || data.error || "Onbekende fout"));
                }

                // deprecated: rely on polling
                //fetch_vms();
            } catch (err) {
                announce(fail + ": netwerkfout " + err);
            }
        }

        async function vm_remove(name) {
            vm_send_action(
                name,
                '/remove',
                name + " wordt verwijdert",
                name + " kon niet verwijderen"
            );
        }

        async function vm_stop(name) {
            announce(name + " wordt gestopt, even geduld");

            vm_send_action(
                name,
                '/stop',
                name + " wordt gestopt, even geduld",
                name + " kon niet stoppen"
            );
        }

        async function vm_start(name) {
            vm_send_action(
                name,
                '/start',
                name + " wordt gestart",
                name + " kon niet starten"
            );
        }

        add_vm_button.onclick = async () => {
            const path = add_vm_path.value.trim();
            if (!path) {
                announce("Voer een VMX-bestandspad in");
                return;
            }

            // Use the file name as VM name by default
            const name = path.split(/[/\\]/).pop().replace(/\.vmx$/i, '');

            try {
                const res = await fetch('/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, path })
                });

                const data = await res.json();
                if (res.ok && data.status) {
                    announce(name + " is toegevoegd");
                    add_vm_path.value = ""; // clear input
                    fetch_vms(); // refresh table
                } else {
                    announce("Error: " + (data.error || " Toevoegen is mislukt"));
                }
            } catch (err) {
                announce("Network fout: " + err);
            }
        };

        async function fetch_vmsLoop() {
            await fetch_vms();

            setInterval(fetch_vms, fetch_vms_interval);
        }

        fetch_vmsLoop();
    </script>
</body>
</html>
