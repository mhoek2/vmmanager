name: Build binaries

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

jobs:
  deploy-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          echo "Running PyInstaller..."
          pyinstaller main.spec

      - name: Zip the dist folder
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        run: |
          powershell Compress-Archive -Path dist/* -DestinationPath windows-package.zip

      - name: Upload artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: windows-package.zip

  create-beta-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    needs: [deploy-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: ./windows-dist

      - name: Create Beta
        id: create_beta
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          automatic_release_tag: "latest-beta"
          prerelease: true
          title: "Beta"
          files: |
            ./windows-dist/windows-package.zip
            
  create-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: ./windows-dist

      - name: Create Release
        id: create_release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          automatic_release_tag: "latest"
          prerelease: false
          title: "Latest Release"
          files: |
            ./windows-dist/windows-package.zip