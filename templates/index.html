<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VM Manager</title>
</head>
<body>

    <div id="main_container" role="main">
        <h1>VM Manager</h1>

        <section aria-labelledby="vm_list_title">
            <h2 id="vm_list_title">Lijst met Virtual Machines</h2>

            <table border="1" aria-label="Lijst met Virtual Machines met status en acties">
                <thead>
                    <tr>
                        <th scope="col">VM Name</th>
                        <th scope="col">Status</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="vms"></tbody>
            </table>

            <button onclick="fetch_vms( true )" type="button" aria-controls="vms">Ververs lijst</button>
        </section>

        <section role="region" aria-labelledby="add_vm_title">
            <h2 id="add_vm_title">VM toevoegen aan lijst</h2>

            <label for="add_vm_path">Pad naar VMX-bestand</label>
            <input type="text" id="add_vm_path" placeholder="C:\vms\vm.vmx" aria-required="true">
            <button id="add_vm_button" type="button">VM Toevoegen</button>
        </section>

        <div role="status" aria-live="polite" aria-atomic="true" id="status"></div>
    </div>

    <script>
        const fetch_vms_interval = 3000;
        const add_vm_path = document.getElementById('add_vm_path');
        const add_vm_button = document.getElementById('add_vm_button');

        function announce(msg) {
            const status = document.getElementById('status');
            status.textContent = msg;
        }

        async function fetch_vms(manual_refresh = false) {
            const res = await fetch('/vms');
            const data = await res.json();
            const vms = data.list;

            const table = document.getElementById('vms');

            // Track existing rows by VM name
            const current_vms = {};
            Array.from(table.rows).forEach(row => {
                const name = row.cells[0].textContent;
                current_vms[name] = row;
            });

            // Update or add rows
            vms.forEach(vm => {
                if (current_vms[vm.name]) {
                    // VM already exists, just update status and button
                    const row = current_vms[vm.name];

                    // status
                    if (row.cells[1].textContent !== vm.status) {
                        announce(vm.name + " status is gewijzigd naar " + vm.status);
                    }
                    row.cells[1].textContent = vm.status;

                    // action button
                    const btn = row.cells[2].querySelector('button');
                    if (vm.status === 'running') {
                        btn.textContent = 'Stop';
                        btn.setAttribute('aria-label', 'Stop VM ' + vm.name);
                        btn.setAttribute('type', 'button');
                        btn.onclick = () => vm_stop(vm.name);
                    } else {
                        btn.textContent = 'Start';
                        btn.setAttribute('aria-label', 'Start VM ' + vm.name);
                        btn.setAttribute('type', 'button');
                        btn.onclick = () => vm_start(vm.name);
                    }

                    delete current_vms[vm.name]; // mark as handled
                }

                else {
                    // VM is new, create a new row
                    const row = document.createElement('tr');

                    const td_name = document.createElement('td');
                    td_name.textContent = vm.name;

                    const td_status = document.createElement('td');
                    td_status.textContent = vm.status;

                    const td_actions = document.createElement('td');
                    const btn_start_stop = document.createElement('button');
                    if (vm.status === 'running') {
                        btn_start_stop.textContent = 'Stop';
                        btn_start_stop.setAttribute('aria-label', 'Stop VM ' + vm.name);
                        btn_start_stop.onclick = () => vm_stop(vm.name);
                    } else {
                        btn_start_stop.textContent = 'Start';
                        btn_start_stop.setAttribute('aria-label', 'Start VM ' + vm.name);
                        btn_start_stop.onclick = () => vm_start(vm.name);
                    }

                    const btn_remove = document.createElement('button');
                    btn_remove.textContent = 'Verwijder';
                    btn_remove.setAttribute('aria-label', 'Verwijder VM ' + vm.name + ' uit de lijst');
                    btn_remove.setAttribute('type', 'button');
                    btn_remove.onclick = () => vm_remove(vm.name);

                    td_actions.appendChild(btn_start_stop);
                    td_actions.appendChild(btn_remove);

                    row.appendChild(td_name);
                    row.appendChild(td_status);
                    row.appendChild(td_actions);

                    table.appendChild(row);
                }
            });

            // Remove rows that no longer exist
            Object.values(current_vms).forEach(row => row.remove());

            if (manual_refresh)
                announce("VM lijst is geupdate");
        }

        async function vm_send_action(name, url, success, fail) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const data = await res.json();

                if (res.ok && data.status) {
                    announce(success);
                } else {
                    announce(fail + ": " + (data.message || data.error || "Onbekende fout"));
                }

                fetch_vms();
            } catch (err) {
                announce(fail + ": netwerkfout " + err);
            }
        }

        async function vm_remove(name) {
            vm_send_action(
                name,
                '/remove',
                name + " wordt verwijdert",
                name + " kon niet verwijderen"
            );
        }

        async function vm_stop(name) {
            vm_send_action(
                name,
                '/stop',
                name + " wordt gestopt",
                name + " kon niet stoppen"
            );
        }

        async function vm_start(name) {
            vm_send_action(
                name,
                '/start',
                name + " is gestart",
                name + " kon niet starten"
            );
        }

        add_vm_button.onclick = async () => {
            const path = add_vm_path.value.trim();
            if (!path) {
                announce("Voer een VMX-bestandspad in");
                return;
            }

            // Use the file name as VM name by default
            const name = path.split(/[/\\]/).pop().replace(/\.vmx$/i, '');

            try {
                const res = await fetch('/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, path })
                });

                const data = await res.json();
                if (res.ok && data.status) {
                    announce(name + " is toegevoegd");
                    add_vm_path.value = ""; // clear input
                    fetch_vms(); // refresh table
                } else {
                    announce("Error: " + (data.error || " Toevoegen is mislukt"));
                }
            } catch (err) {
                announce("Network fout: " + err);
            }
        };

        async function fetch_vmsLoop() {
            await fetch_vms();

            setInterval(fetch_vms, fetch_vms_interval);
        }

        fetch_vmsLoop();
    </script>
</body>
</html>
